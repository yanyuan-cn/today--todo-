name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Download xlsx library
        run: |
          mkdir -p www/lib
          curl -L -o www/lib/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Restore keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: android/app/todaytodo.keystore
          key: todaytodo-keystore-v1

      - name: Generate keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/todaytodo.keystore \
            -alias todaytodo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass TodayTodo2026 \
            -keypass TodayTodo2026 \
            -dname "CN=TodayTodo, OU=Personal, O=Personal, L=Chengdu, ST=Sichuan, C=CN"

      - name: Configure signing
        run: |
          cat > android/app/signing.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file("todaytodo.keystore")
                      storePassword "TodayTodo2026"
                      keyAlias "todaytodo"
                      keyPassword "TodayTodo2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          if ! grep -q "signing.gradle" android/app/build.gradle; then
            echo 'apply from: "signing.gradle"' >> android/app/build.gradle
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: today-todo-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: android/app/todaytodo.keystore
