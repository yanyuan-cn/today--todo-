<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f6fed">
<title>测试版</title>
<style>
body{margin:0;font-family:sans-serif;background:#f5f6f8;padding-bottom:70px;padding-top:50px}
header{background:#fff;position:fixed;top:0;left:0;right:0;height:50px;line-height:50px;text-align:center;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.06);z-index:100}
main{padding:20px}
section{display:none}
section.active{display:block}
.card{background:#fff;border-radius:12px;padding:20px;text-align:center;margin-bottom:12px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;display:flex;box-shadow:0 -1px 4px rgba(0,0,0,.06)}
.nav-item{flex:1;display:flex;align-items:center;justify-content:center;color:#888;cursor:pointer;font-size:14px}
.nav-item.active{color:#2f6fed;font-weight:bold}
</style>
</head>
<body>

<header id="title">今日待办</header>

<main>
  <section id="tab-1" class="active">
    <div class="card" onclick="alert('卡片点击成功！')">我是今日待办，点我试试</div>
  </section>
  <section id="tab-2">
    <div class="card">我是历史待办</div>
  </section>
  <section id="tab-3">
    <div class="card">我是我的页面</div>
  </section>
</main>

<nav class="bottom-nav">
  <div class="nav-item active" onclick="goTab(1, '今日待办')">今日待办</div>
  <div class="nav-item" onclick="goTab(2, '历史待办')">历史待办</div>
  <div class="nav-item" onclick="goTab(3, '我的')">我的</div>
</nav>

<script>
  // 超级简单的切换逻辑
  function goTab(num, title) {
    document.getElementById('title').innerText = title;
    document.getElementById('tab-1').className = '';
    document.getElementById('tab-2').className = '';
    document.getElementById('tab-3').className = '';
    document.getElementById('tab-' + num).className = 'active';
    
    // 改变底部按钮颜色
    var navs = document.querySelectorAll('.nav-item');
    for(var i=0; i<navs.length; i++) {
      navs[i].className = 'nav-item';
    }
    // 当前点击的按钮变色
    event.target.className = 'nav-item active';
  }
</script>
</body>
</html>
