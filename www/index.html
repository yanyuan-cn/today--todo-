<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>今日待办</title>
<script src="lib/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#222;padding-bottom:40px}
header{background:#fff;padding:14px 16px 10px;position:sticky;top:0;box-shadow:0 1px 4px rgba(0,0,0,.06);z-index:10}
h1{font-size:18px;margin:0 0 10px}
nav{display:flex;gap:8px}
nav button{border:0;background:#eee;padding:6px 16px;border-radius:16px;font-size:14px;color:#444}
nav button.active{background:#2f6fed;color:#fff}
main{padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.group-title{font-size:14px;color:#666;margin:18px 4px 8px;font-weight:600}
.group-title.overdue{color:#e5484d}
.task .t-top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.task .t-top b{font-weight:600}
.task .time{color:#666;font-size:13px;flex-shrink:0}
.task .time.red{color:#e5484d;font-weight:600}
.task .t-sub{color:#555;font-size:13px;margin-top:4px}
.task .t-people{color:#888;font-size:12px;margin-top:4px}
.muted{color:#888}.small{font-size:12px}
.mapping-view{margin:10px 0;border-top:1px dashed #eee;padding-top:8px}
.mline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.mline span:first-child{color:#888}
.mline .bad{color:#e5484d}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{border:1px solid #ddd;background:#fff;padding:6px 12px;border-radius:8px;font-size:13px}
.actions button.danger{color:#e5484d;border-color:#f3c2c2}
.mapping-edit{margin-top:10px;border-top:1px dashed #eee;padding-top:8px}
.mapping-edit select{font-size:13px;padding:4px;max-width:55%}
#upload-form{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
#upload-form input[type=text],#upload-form input[type=file]{width:100%;margin-bottom:10px;font-size:14px;padding:8px;border:1px solid #ddd;border-radius:8px;background:#fafafa}
#upload-form button{width:100%;border:0;background:#2f6fed;color:#fff;padding:10px;border-radius:8px;font-size:15px}
#upload-form button:disabled{opacity:.6}
.empty{color:#999;text-align:center;padding:40px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:99}
</style>
</head>
<body>
<header>
  <h1>今日待办</h1>
  <nav>
    <button data-tab="tasks" class="active">待办</button>
    <button data-tab="docs">文档</button>
  </nav>
</header>
<main>
  <section id="tab-tasks"><div id="task-groups"></div></section>
  <section id="tab-docs" hidden>
    <form id="upload-form">
      <input type="text" name="name" placeholder="文档名称，如：检验任务表A" required>
      <input type="file" name="file" accept=".xlsx,.xlsm" required>
      <button type="submit">上传并解析</button>
    </form>
    <div id="doc-list"></div>
  </section>
</main>
<script>
const FIELDS=[
  ["project","项目"],["batch_no","批号"],["item","检项"],
  ["expected_sample_time","预计送样时间"],["sample_sender","送样人"],
  ["registrar","登记人"],["inspector","检验人员"]
];
const ALIASES={
  project:["项目","项目名称"],
  batch_no:["批号","批次","批次号"],
  item:["检项","检验项目","检测项目"],
  expected_sample_time:["预计送样时间","送样时间","预计送样"],
  sample_sender:["送样人","送样"],
  registrar:["登记人","登记"],
  inspector:["检验人员","检验人","检验员"]
};
let DOCS=[],TASKS=[];
const S={
  getDocs(){return JSON.parse(localStorage.getItem("tt_docs")||"[]")},
  saveDocs(d){localStorage.setItem("tt_docs",JSON.stringify(d))},
  getTasks(){return JSON.parse(localStorage.getItem("tt_tasks")||"[]")},
  saveTasks(t){localStorage.setItem("tt_tasks",JSON.stringify(t))}
};
function nextId(arr){return arr.length?Math.max(...arr.map(x=>x.id))+1:1}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return (h>>>0).toString(16)}
function fmtD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function parseTimeSafe(raw){
  if(raw==null||raw==="")return null;
  if(raw instanceof Date&&!isNaN(raw))return fmtD(raw);
  const s=String(raw).trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})月(\d{1,2})日?$/);
  if(m)return `${new Date().getFullYear()}-${String(+m[1]).padStart(2,"0")}-${String(+m[2]).padStart(2,"0")}`;
  m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m)return `${m[1]}-${String(+m[2]).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
  const d=new Date(s);if(!isNaN(d))return fmtD(d);
  return null;
}
function autoMap(cols){
  const m={};
  for(const [k,as] of Object.entries(ALIASES)) for(const a of as) if(cols.includes(a)){m[k]=a;break}
  return m;
}
function readWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:"yyyy-mm-dd",defval:null});
  if(!rows.length)return {columns:[],data:[]};
  const seen={},header=rows[0].map((h,i)=>{
    let n=(h==null||String(h).trim()==="")?`列${i+1}`:String(h).trim();
    if(seen[n]){seen[n]++;n+=`_${seen[n]}`}else seen[n]=1;
    return n;
  });
  const data=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(r.every(v=>v==null||String(v).trim()===""))continue;
    const o={};header.forEach((k,idx)=>o[k]=r[idx]??null);data.push(o);
  }
  return {columns:header,data};
}
function applyMapping(docId,mapping,rows){
  const keep=S.getTasks().filter(t=>t.doc_id!==docId);
  const fresh=[];let id=nextId(keep);
  const seen=new Set();
  for(const row of rows){
    const item=String(row[mapping.item]||"").trim();if(!item)continue;
    const project=String(row[mapping.project]||"").trim();
    const batch=String(row[mapping.batch_no]||"").trim();
    const key=hash(`${project}|${batch}|${item}`);
    if(seen.has(key))continue;seen.add(key);
    const rawTime=row[mapping.expected_sample_time];
    fresh.push({
      id:id++,doc_id:docId,row_key:key,
      project,batch_no:batch,item,
      sample_time_raw:rawTime==null?"":(rawTime instanceof Date?fmtD(rawTime):String(rawTime)),
      sample_time_parsed:parseTimeSafe(rawTime),
      sample_sender:String(row[mapping.sample_sender]||""),
      registrar:String(row[mapping.registrar]||""),
      inspector:String(row[mapping.inspector]||""),
      raw_json:JSON.stringify(row),
      updated_at:new Date().toISOString()
    });
  }
  S.saveTasks([...keep,...fresh]);
  const docs=S.getDocs();const d=docs.find(x=>x.id===docId);
  if(d){d.last_sync_at=new Date().toISOString();S.saveDocs(docs)}
}
document.getElementById("upload-form").onsubmit=async e=>{
  e.preventDefault();
  const btn=e.target.querySelector("button");btn.disabled=true;btn.textContent="解析中...";
  try{
    const name=e.target.name.value.trim();
    const file=e.target.file.files[0];if(!file)return;
    const buf=await file.arrayBuffer();
    const {columns,data}=readWorkbook(buf);
    if(!columns.length)throw new Error("表格为空");
    const mapping=autoMap(columns);
    const docs=S.getDocs();const id=nextId(docs);
    docs.push({id,name,columns,mapping,last_sync_at:new Date().toISOString()});
    S.saveDocs(docs);
    applyMapping(id,mapping,data);
    e.target.reset();
    loadDocs();loadTasks();
    toast(`已导入：${columns.length} 列，匹配 ${Object.keys(mapping).length} 个字段`);
  }catch(err){alert("解析失败："+err.message)}
  finally{btn.disabled=false;btn.textContent="上传并解析"}
};
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    const t=b.dataset.tab;
    document.getElementById("tab-tasks").hidden=t!=="tasks";
    document.getElementById("tab-docs").hidden=t!=="docs";
    t==="tasks"?loadTasks():loadDocs();
  };
});
function loadDocs(){DOCS=S.getDocs();renderDocs()}
function renderDocs(){
  const el=document.getElementById("doc-list");
  if(!DOCS.length){el.innerHTML='<p class="empty">还没有文档，先上传一个 xlsx</p>';return}
  el.innerHTML=DOCS.map(d=>{
    const rows=FIELDS.map(([k,l])=>{
      const v=d.mapping[k]||"—";
      return `<div class="mline"><span>${l}</span><span class="${d.mapping[k]?"":"bad"}">${esc(v)}</span></div>`;
    }).join("");
    return `<div class="card" data-id="${d.id}">
      <div><b>${esc(d.name)}</b></div>
      <div class="muted small" style="margin-top:4px">最近同步：${esc((d.last_sync_at||"").slice(0,16).replace("T"," ")||"未同步")}</div>
      <div class="mapping-view">${rows}</div>
      <div class="actions">
        <button data-act="edit" data-id="${d.id}">编辑映射</button>
        <button data-act="replace" data-id="${d.id}">更新表格</button>
        <button data-act="del" data-id="${d.id}" class="danger">删除</button>
      </div>
      <div class="mapping-edit" hidden></div>
      <input type="file" accept=".xlsx,.xlsm" hidden data-replace="${d.id}">
    </div>`;
  }).join("");
}
document.getElementById("doc-list").addEventListener("click",e=>{
  const btn=e.target.closest("button");if(!btn)return;
  const act=btn.dataset.act,id=+btn.dataset.id;
  const doc=DOCS.find(x=>x.id===id);if(!doc)return;
  if(act==="edit"){
    const box=document.querySelector(`.card[data-id="${id}"] .mapping-edit`);
    if(!box.hidden){box.hidden=true;box.innerHTML="";return}
    box.hidden=false;
    box.innerHTML=FIELDS.map(([k,l])=>`
      <label class="mline"><span>${l}</span>
        <select data-key="${k}">
          <option value="">（不映射）</option>
          ${doc.columns.map(c=>`<option value="${esc(c)}" ${doc.mapping[k]===c?"selected":""}>${esc(c)}</option>`).join("")}
        </select></label>`).join("")+
      `<button data-act="save" data-id="${id}" style="margin-top:8px;width:100%;border:0;background:#2f6fed;color:#fff;padding:9px;border-radius:8px">保存并重新解析</button>`;
  }
  else if(act==="save"){
    const card=btn.closest(".card");const mapping={};
    card.querySelectorAll(".mapping-edit select").forEach(s=>{if(s.value)mapping[s.dataset.key]=s.value});
    const docs=S.getDocs();const d=docs.find(x=>x.id===id);d.mapping=mapping;S.saveDocs(docs);
    const rows=S.getTasks().filter(t=>t.doc_id===id).map(t=>JSON.parse(t.raw_json));
    applyMapping(id,mapping,rows);
    loadDocs();loadTasks();toast("映射已更新");
  }
  else if(act==="replace"){document.querySelector(`input[data-replace="${id}"]`).click()}
  else if(act==="del"){
    if(!confirm("确定删除该文档及其任务？"))return;
    S.saveTasks(S.getTasks().filter(t=>t.doc_id!==id));
    S.saveDocs(S.getDocs().filter(d=>d.id!==id));
    loadDocs();loadTasks();
  }
});
document.getElementById("doc-list").addEventListener("change",async e=>{
  const inp=e.target.closest("input[data-replace]");if(!inp)return;
  const id=+inp.dataset.replace;const f=inp.files[0];if(!f)return;
  const docs=S.getDocs();const d=docs.find(x=>x.id===id);if(!d)return;
  const buf=await f.arrayBuffer();
  const {columns,data}=readWorkbook(buf);
  d.columns=columns;d.mapping=autoMap(columns);d.last_sync_at=new Date().toISOString();
  S.saveDocs(docs);
  applyMapping(id,d.mapping,data);
  inp.value="";
  loadDocs();loadTasks();toast("表格已更新");
});
function loadTasks(){TASKS=S.getTasks();renderTasks()}
function renderTasks(){
  const today=new Date();today.setHours(0,0,0,0);
  const todayStr=fmtD(today);
  const weekEnd=new Date(today);weekEnd.setDate(weekEnd.getDate()+7);
  const g={overdue:[],today:[],week:[],later:[],none:[]};
  TASKS.forEach(t=>{
    if(!t.sample_time_parsed){g.none.push(t);return}
    const ds=t.sample_time_parsed.slice(0,10);
    const dt=new Date(ds+"T00:00:00");
    if(dt<today)g.overdue.push(t);
    else if(ds===todayStr)g.today.push(t);
    else if(dt<=weekEnd)g.week.push(t);
    else g.later.push(t);
  });
  const order=[["overdue","逾期",true],["today","今天",false],["week","本周",false],["later","以后",false],["none","无日期",false]];
  let html="";
  order.forEach(([k,title,red])=>{
    const list=g[k];if(!list.length)return;
    html+=`<div class="group-title ${red?"overdue":""}">${title} · ${list.length}</div>`;
    html+=list.map(t=>{
      const people=[t.sample_sender&&`送样 ${esc(t.sample_sender)}`,t.registrar&&`登记 ${esc(t.registrar)}`,t.inspector&&`检验 ${esc(t.inspector)}`].filter(Boolean).join(" · ");
      const parsed=t.sample_time_parsed?`<span class="small muted">→ ${esc(t.sample_time_parsed)}</span>`:`<span class="small muted">→ 无法解析，仅显示原文</span>`;
      return `<div class="card task">
        <div class="t-top"><b>${esc(t.item||"—")}</b><span class="time ${red?"red":""}">${esc(t.sample_time_raw||"—")}</span></div>
        <div class="t-sub">${esc(t.project||"")}${t.batch_no?" · 批号 "+esc(t.batch_no):""}</div>
        ${people?`<div class="t-people">${people}</div>`:""}
        <div style="margin-top:4px">${parsed}</div>
      </div>`;
    }).join("");
  });
  document.getElementById("task-groups").innerHTML=html||'<p class="empty">暂无任务，先去「文档」上传一个 xlsx</p>';
}
loadTasks();loadDocs();
</script>
</body>
</html>
